<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio de Brigadas de Campo</title>
    <!-- Framework de estilos responsivos -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-[#f4f1ea] font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-sm space-y-6">
        
        <!-- PANTALLA A: FORMULARIO DE ACCESO Y CAPTURA -->
        <div id="seccionFormulario" class="bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden transition-all duration-300">
            <div class="bg-[#611232] p-5 text-center text-white">
                <h1 class="text-lg font-bold tracking-wide">Identificación de Brigadistas</h1>
                <p class="text-xs text-[#ddc9a3] tracking-widest mt-0.5">ESTADOS UNIDOS MEXICANOS</p>
            </div>

            <form id="perfilForm" class="p-5 space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider">CURP / Identificación Única</label>
                    <div class="flex gap-2 mt-1">
                        <input type="text" id="identificacion" required class="flex-1 p-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#611232] focus:border-[#611232] outline-none text-gray-800 font-mono uppercase" placeholder="Ej. IAGE571015...">
                        <button type="button" id="btnBuscar" class="bg-gray-800 text-white px-4 rounded-xl font-bold hover:bg-gray-900 transition text-sm">
                            🔍 Buscar
                        </button>
                    </div>
                </div>

                <!-- Campos ocultos que se activan dinámicamente -->
                <div id="camposRegistro" class="hidden space-y-3 pt-2 border-t border-gray-100">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider">Nombre(s)</label>
                        <input type="text" id="nombre" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-xl outline-none text-gray-800 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider">Primer Apellido</label>
                            <input type="text" id="apellido1" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-xl outline-none text-gray-800 text-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider">Segundo Apellido</label>
                            <input type="text" id="apellido2" class="w-full mt-1 p-2.5 border border-gray-300 rounded-xl outline-none text-gray-800 text-sm">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider">Teléfono</label>
                            <input type="tel" id="telefono" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-xl outline-none text-gray-800 text-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider">Tipo de Sangre</label>
                            <input type="text" id="sangre" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-xl outline-none text-gray-800 text-sm uppercase" placeholder="Ej. O+">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider">Región / Zona</label>
                            <input type="text" id="region" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-xl outline-none text-gray-800 text-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider">No. Brigada</label>
                            <input type="text" id="brigada" required class="w-full mt-1 p-2.5 border border-gray-300 rounded-xl outline-none text-gray-800 text-sm">
                        </div>
                    </div>
                    <div class="flex flex-col items-center pt-2">
                        <label class="cursor-pointer bg-gray-100 text-gray-700 border border-gray-300 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-gray-200 transition">
                            📸 Seleccionar Fotografía Oficial
                            <input type="file" id="inputFoto" accept="image/*" class="hidden">
                        </label>
                    </div>
                    <button type="submit" id="btnGuardar" class="w-full bg-[#611232] text-white py-3 rounded-xl font-bold shadow-lg hover:bg-[#4a0e26] transition-all mt-2 text-sm">
                        💾 Guardar Registro
                    </button>
                </div>
            </form>
        </div>

        <!-- PANTALLA B: CREDENCIAL OFICIAL GOBIERNO -->
        <div id="seccionCredencial" class="hidden w-full max-w-sm bg-[#fcfaf6] rounded-2xl shadow-2xl overflow-hidden border border-gray-300 relative flex flex-col justify-between" style="min-height: 560px;">
            <div class="bg-[#611232] pt-6 pb-4 px-4 text-center text-white relative">
                <h2 class="text-base font-bold tracking-wider leading-tight">Servicio Universal de Salud</h2>
                <p class="text-[10px] text-[#ddc9a3] font-medium tracking-widest mt-0.5 uppercase">Estados Unidos Mexicanos</p>
            </div>

            <div class="px-6 py-4 flex flex-col items-center flex-1 justify-center relative">
                <div class="w-36 h-44 bg-gray-200 border-4 border-white shadow-md overflow-hidden relative rounded-md mb-4">
                    <img id="credFoto" src="https://placeholder.com" class="w-full h-full object-cover">
                    <div class="absolute top-2 right-2 w-8 h-8 rounded-full border border-amber-500/20 flex items-center justify-center text-[5px] text-amber-600/30 font-bold rotate-12">MÉXICO</div>
                </div>

                <div class="w-full text-center space-y-3">
                    <div>
                        <p class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">Nombre(s)</p>
                        <p id="credNombre" class="text-lg font-bold text-gray-800 leading-tight">-</p>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <p class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">Primer apellido</p>
                            <p id="credApellido1" class="text-base font-semibold text-gray-800">-</p>
                        </div>
                        <div>
                            <p class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">Segundo apellido</p>
                            <p id="credApellido2" class="text-base font-semibold text-gray-800">-</p>
                        </div>
                    </div>
                    <div class="pt-2 border-t border-gray-200">
                        <p class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">CURP</p>
                        <p id="credIdentificacion" class="text-sm font-mono font-bold tracking-wider text-gray-900 uppercase">-</p>
                    </div>
                    <div class="grid grid-cols-2 gap-2 pt-1 text-left text-xs bg-gray-50 p-2 rounded-lg border border-gray-100">
                        <div>
                            <span class="text-[9px] text-gray-400 block font-bold">BRIGADA:</span>
                            <span id="credBrigada" class="font-medium text-gray-700">-</span>
                        </div>
                        <div>
                            <span class="text-[9px] text-gray-400 block font-bold">SANGRE:</span>
                            <span id="credSangre" class="font-bold text-red-700">-</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white border-t border-gray-200 px-4 py-3 flex justify-between items-center gap-1 overflow-x-auto">
                <span class="text-[8px] font-bold text-green-800 font-serif">IMSS</span>
                <span class="text-[8px] font-bold text-red-800 font-serif">ISSSTE</span>
                <span class="text-[8px] font-bold text-red-700 font-serif">PEMEX</span>
                <span class="text-[8px] font-bold text-green-700 font-serif">PCIVIL</span>
                <span class="text-[8px] font-bold text-emerald-800 font-sans tracking-tighter">IMSS BIENESTAR</span>
            </div>
            <div class="h-1 w-full bg-gradient-to-r from-green-700 via-white to-red-700"></div>
        </div>

        <!-- Acceso rápido para alternar pantallas -->
        <button id="btnVolver" class="hidden w-full text-center text-xs text-gray-500 font-semibold underline hover:text-[#611232] transition">
            ◀ Volver al buscador
        </button>
    </div>

    <!-- Vinculación del script interactivo -->
    <script src="app.js"></script>
</body>
</html>
