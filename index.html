<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio de Brigadas de Campo</title>
    <!-- Vinculación del CSS independiente -->
    <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem;">

    <div style="width: 100%; max-w: 24rem; display: flex; flex-direction: column; gap: 1.5rem;">
        
        <!-- PANTALLA A: FORMULARIO DE ACCESO Y CAPTURA -->
        <div id="seccionFormulario" class="tarjeta-control">
            <div class="encabezado-institucional">
                <h1 class="titulo-principal">Identificación de Brigadistas</h1>
                <p class="subtitulo-patria">ESTADOS UNIDOS MEXICANOS</p>
            </div>

            <form id="perfilForm" style="padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label class="campo-etiqueta">CURP / Identificación Única</label>
                    <div class="flex-row-grid" style="margin-top: 0.25rem;">
                        <input type="text" id="identificacion" required class="campo-input id-mono" placeholder="Ej. IAGE571015...">
                        <button type="button" id="btnBuscar" class="btn-buscar">🔍 Buscar</button>
                    </div>
                </div>

                <!-- Campos de registro ocultos al inicio -->
                <div id="camposRegistro" class="hidden" style="display: flex; flex-direction: column; gap: 0.75rem; padding-top: 0.75rem; border-top: 1px solid #f3f4f6;">
                    <div>
                        <label class="campo-etiqueta">Nombre(s)</label>
                        <input type="text" id="nombre" required class="campo-input">
                    </div>
                    <div class="grid-2">
                        <div>
                            <label class="campo-etiqueta">Primer Apellido</label>
                            <input type="text" id="apellido1" required class="campo-input">
                        </div>
                        <div>
                            <label class="campo-etiqueta">Segundo Apellido</label>
                            <input type="text" id="apellido2" class="campo-input">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div>
                            <label class="campo-etiqueta">Teléfono</label>
                            <input type="tel" id="telefono" required class="campo-input">
                        </div>
                        <div>
                            <label class="campo-etiqueta">Tipo de Sangre</label>
                            <input type="text" id="sangre" required class="campo-input" placeholder="Ej. O+">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div>
                            <label class="campo-etiqueta">Región / Zona</label>
                            <input type="text" id="region" required class="campo-input">
                        </div>
                        <div>
                            <label class="campo-etiqueta">No. Brigada</label>
                            <input type="text" id="brigada" required class="campo-input">
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: center; padding-top: 0.5rem;">
                        <label style="cursor: pointer; background-color: #f3f4f6; padding: 0.5rem 1rem; border: 1px solid #d1d5db; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 600;">
                            📸 Seleccionar Fotografía Oficial
                            <input type="file" id="inputFoto" accept="image/*" style="display: none;">
                        </label>
                    </div>
                    <button type="submit" id="btnGuardar" class="btn-guardar">💾 Guardar Registro</button>
                </div>
            </form>
        </div>

        <!-- PANTALLA B: CREDENCIAL OFICIAL GOBIERNO -->
        <div id="seccionCredencial" class="gafete-realista hidden">
            <div class="encabezado-institucional" style="padding-top: 1.5rem; padding-bottom: 1rem;">
                <h2 style="font-size: 1rem; font-weight: 700; letter-spacing: 0.025em;">Servicio Universal de Salud</h2>
                <p class="subtitulo-patria uppercase">Estados Unidos Mexicanos</p>
            </div>

            <div style="padding: 1rem 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1;">
                <div class="marco-fotografia">
                    <img id="credFoto" src="https://placeholder.com" style="width: 100%; height: 100%; object-fit: cover;">
                </div>

                <div class="datos-gafete-contenedor">
                    <div style="margin-bottom: 0.5rem;">
                        <p class="cred-label">Nombre(s)</p>
                        <p id="credNombre" class="cred-valor-principal">-</p>
                    </div>
                    <div class="grid-2" style="margin-bottom: 0.5rem;">
                        <div>
                            <p class="cred-label">Primer apellido</p>
                            <p id="credApellido1" class="cred-valor-secondario">-</p>
                        </div>
                        <div>
                            <p class="cred-label">Segundo apellido</p>
                            <p id="credApellido2" class="cred-valor-secondario">-</p>
                        </div>
                    </div>
                    <div style="padding-top: 0.5rem; border-top: 1px solid #e5e7eb;">
                        <p class="cred-label">CURP</p>
                        <p id="credIdentificacion" class="cred-valor-mono">-</p>
                    </div>
                    <div class="grid-2 bloque-metadatos" style="text-align: left;">
                        <div>
                            <span class="cred-label" style="font-size: 0.55rem; block">BRIGADA:</span>
                            <span id="credBrigada" style="font-size: 0.8rem; font-weight: 500;">-</span>
                        </div>
                        <div>
                            <span class="cred-label" style="font-size: 0.55rem; block">SANGRE:</span>
                            <span id="credSangre" style="font-size: 0.8rem; font-weight: 700; color: #b91c1c;">-</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="logos-salud-barra">
                <span style="color: #166534; font-family: serif;">IMSS</span>
                <span style="color: #831843; font-family: serif;">ISSSTE</span>
                <span style="color: #991b1b; font-family: serif;">PEMEX</span>
                <span style="color: #15803d; font-family: serif;">PCIVIL</span>
                <span style="color: #064e3b; font-family: sans-serif; letter-spacing: -0.05em;">IMSS BIENESTAR</span>
            </div>
            
            <div style="display: flex; h: 4px; width: 100%;">
                <div style="width: 33.33%; background-color: #15803d; height: 4px;"></div>
                <div style="width: 33.33%; background-color: #ffffff; height: 4px;"></div>
                <div style="width: 33.33%; background-color: #b91c1c; height: 4px;"></div>
            </div>
        </div>

        <button id="btnVolver" class="hidden" style="background: none; border: none; text-align: center; font-size: 0.75rem; font-weight: 600; text-decoration: underline; color: #6b7280; cursor: pointer;">
            ◀ Volver al buscador
        </button>
    </div>

    <!-- Enlace al controlador JavaScript -->
    <script src="app.js"></script>
</body>
</html>
