<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro y Edición de Brigadistas</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden mt-4">
        <div class="bg-orange-600 p-6 text-center text-white">
            <h1 class="text-xl font-bold tracking-wide">Control de Brigadistas</h1>
            <p class="text-sm opacity-90" id="estadoTitulo">Ingrese su ID para iniciar</p>
        </div>

        <form id="perfilForm" class="p-6 space-y-5">
            <!-- Buscador por Identificación (Punto de partida) -->
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase">CURP / Identificación Oficial</label>
                <div class="flex gap-2 mt-1">
                    <input type="text" id="identificacion" required class="flex-1 p-2.5 border rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-gray-800 font-mono uppercase" placeholder="EJ. CURP123456">
                    <button type="button" id="btnBuscar" class="bg-gray-800 text-white px-4 rounded-xl font-bold hover:bg-gray-900 transition">
                        🔍 Buscar
                    </button>
                </div>
            </div>

            <!-- Contenedor de Fotografía -->
            <div class="flex flex-col items-center space-y-2">
                <div class="relative w-32 h-32 rounded-full overflow-hidden border-4 border-orange-500 shadow-md">
                    <img id="fotoVista" src="https://placeholder.com" alt="Foto Perfil" class="w-full h-full object-cover">
                </div>
                <label class="cursor-pointer bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-gray-300 transition">
                    📸 Subir/Cambiar Foto
                    <input type="file" id="inputFoto" accept="image/*" class="hidden">
                </label>
            </div>

            <!-- Resto de los campos (Bloqueados hasta que busque o sea nuevo) -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">Nombre Completo</label>
                    <input type="text" id="nombre" required class="w-full mt-1 p-2.5 border rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-gray-800">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase">Teléfono</label>
                        <input type="tel" id="telefono" required class="w-full mt-1 p-2.5 border rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-gray-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase">Tipo de Sangre</label>
                        <input type="text" id="sangre" required class="w-full mt-1 p-2.5 border rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-gray-800" placeholder="Ej. O+">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase">Región / Zona</label>
                        <input type="text" id="region" required class="w-full mt-1 p-2.5 border rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-gray-800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase">No. Brigada</label>
                        <input type="text" id="brigada" required class="w-full mt-1 p-2.5 border rounded-xl focus:ring-2 focus:ring-orange-500 outline-none text-gray-800">
                    </div>
                </div>
            </div>

            <!-- Botón Guardar Dinámico -->
            <button type="submit" id="btnGuardar" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-orange-700 active:scale-[0.98] transition-all mt-4">
                💾 Guardar Brigadista
            </button>
        </form>
    </div>

    <script>
        const BASE_URL = 'http://127.0.0';
        let fotoArchivo = null;

        // BUSCAR BRIGADISTA
        document.getElementById('btnBuscar').addEventListener('click', async () => {
            const id = document.getElementById('identificacion').value.trim().toUpperCase();
            if (!id) return alert('Por favor, ingresa una identificación');

            try {
                const res = await fetch(`${BASE_URL}/${id}`);
                const datos = await res.json();

                if (datos.existe) {
                    document.getElementById('estadoTitulo').innerText = "📝 Editando Perfil Existente";
                    document.getElementById('nombre').value = datos.nombre;
                    document.getElementById('telefono').value = datos.telefono;
                    document.getElementById('sangre').value = datos.sangre;
                    document.getElementById('region').value = datos.region;
                    document.getElementById('brigada').value = datos.brigada;
                    document.getElementById('fotoVista').src = datos.foto_url;
                    document.getElementById('btnGuardar').innerText = "💾 Actualizar Datos";
                } else {
                    document.getElementById('estadoTitulo').innerText = "✨ Nuevo Registro de Brigadista";
                    // Limpiar campos excepto ID para nuevo registro
                    document.getElementById('nombre').value = '';
                    document.getElementById('telefono').value = '';
                    document.getElementById('sangre').value = '';
                    document.getElementById('region').value = '';
                    document.getElementById('brigada').value = '';
                    document.getElementById('fotoVista').src = 'https://placeholder.com';
                    document.getElementById('btnGuardar').innerText = "💾 Registrar como Nuevo";
                }
            } catch (err) {
                alert('Error al buscar en la base de datos');
            }
        });

        // PREVISUALIZAR FOTO
        document.getElementById('inputFoto').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fotoArchivo = file;
                document.getElementById('fotoVista').src = URL.createObjectURL(file);
            }
        });

        // GUARDAR O ACTUALIZAR EN EL SERVIDOR
        document.getElementById('perfilForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('identificacion', document.getElementById('identificacion').value.trim().toUpperCase());
            formData.append('nombre', document.getElementById('nombre').value);
            formData.append('telefono', document.getElementById('telefono').value);
            formData.append('sangre', document.getElementById('sangre').value);
            formData.append('region', document.getElementById('region').value);
            formData.append('brigada', document.getElementById('brigada').value);
            if (fotoArchivo) {
                formData.append('foto', fotoArchivo);
            }

            try {
                const res = await fetch(`${BASE_URL}/guardar`, {
                    method: 'POST',
                    body: formData
                });
                const resultado = await res.json();
                if (resultado.status === 'success') {
                    alert('🎉 ¡Perfil procesado y guardado con éxito!');
                    document.getElementById('fotoVista').src = resultado.foto_url;
                    fotoArchivo = null; // Reset de archivo en memoria
                }
            } catch (err) {
                alert('🔴 Error al conectar con el servidor');
            }
        });
    </script>
</body>
</html>
