<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Servicio de Brigadas de Campo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor-principal-flujo">
        
        <!-- PANTALLA 1: ACCESO POR CURP -->
        <div id="pantalla1" class="tarjeta-control">
            <div class="encabezado-institucional">
                <h1 class="titulo-principal">Identificación de Brigadistas</h1>
                <p class="subtitulo-patria">ESTADOS UNIDOS MEXICANOS</p>
            </div>
            <div style="padding: 2rem 1.25rem; display: flex; flex-direction: column; gap: 1.5rem; flex-grow: 1; justify-content: center;">
                <div>
                    <label class="campo-etiqueta">Ingrese su CURP para continuar</label>
                    <input type="text" id="p1_curp" required class="campo-input id-mono" placeholder="Ej. IAGE571015...">
                </div>
                <button type="button" id="btnAcceder" class="btn-guardar">🔍 Validar Identidad</button>
            </div>
        </div>

        <!-- PANTALLA 2: FORMULARIO REGISTRO / MODIFICACIÓN -->
        <div id="pantalla2" class="tarjeta-control hidden">
            <div class="encabezado-institucional">
                <h1 class="titulo-principal" id="p2_titulo">Registro de Datos</h1>
                <p class="subtitulo-patria">DATOS COMPLEMENTARIOS DEL BRIGADISTA</p>
            </div>
            <form id="perfilForm">
                <div>
                    <label class="campo-etiqueta">CURP (Invariable)</label>
                    <input type="text" id="nombre_curp" readonly class="campo-input id-mono" style="background-color: #f3f4f6;">
                </div>
                <div>
                    <label class="campo-etiqueta">Nombre(s)</label>
                    <input type="text" id="nombre" required class="campo-input">
                </div>
                <div class="grid-2">
                    <div>
                        <label class="campo-etiqueta">Primer Apellido</label>
                        <input type="text" id="ap_paterno" required class="campo-input">
                    </div>
                    <div>
                        <label class="campo-etiqueta">Segundo Apellido</label>
                        <input type="text" id="ap_materno" class="campo-input">
                    </div>
                </div>
                <div class="grid-2">
                    <div>
                        <label class="campo-etiqueta">Municipio</label>
                        <input type="text" id="municipio" required class="campo-input">
                    </div>
                    <div>
                        <label class="campo-etiqueta">Puesto</label>
                        <input type="text" id="puesto" required class="campo-input">
                    </div>
                </div>
                <div class="grid-2">
                    <div>
                        <label class="campo-etiqueta">Teléfono</label>
                        <input type="tel" id="telefono" required class="campo-input">
                    </div>
                    <div>
                        <label class="campo-etiqueta">Zona / Región</label>
                        <input type="text" id="zona" required class="campo-input">
                    </div>
                </div>
                <div>
                    <label class="campo-etiqueta">Correo Electrónico</label>
                    <input type="email" id="correo" required class="campo-input" placeholder="ejemplo@correo.com">
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; padding: 0.75rem 0;">
                    <label style="cursor: pointer; background-color: #f3f4f6; padding: 0.75rem 1.25rem; border: 1px solid #d1d5db; border-radius: 0.75rem; font-size: 0.85rem; font-weight: 600; width: 100%; text-align: center; box-sizing: border-box;">
                        📸 Tomar o Subir Foto
                        <input type="file" id="inputFoto" accept="image/*" capture="environment" style="display: none;">
                    </label>
                    <span id="fotoAviso" style="font-size: 0.75rem; color: #059669; font-weight: 600; margin-top: 0.5rem;" class="hidden">✓ Foto integrada correctamente</span>
                </div>
                <button type="submit" class="btn-guardar">💾 Enviar a Base de Datos</button>
            </form>
        </div>

        <!-- PANTALLA 3: CREDENCIAL DE GOBIERNO -->
        <div id="pantalla3" class="gafete-realista hidden">
            <div class="encabezado-institucional">
                <h2 class="titulo-principal" style="font-size: 1.1rem;">Servicio Universal de Salud</h2>
                <p class="subtitulo-patria" style="text-transform: uppercase;">Estados Unidos Mexicanos</p>
            </div>
            <div style="padding: 1.5rem 1.25rem; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1;">
                <div class="marco-fotografia">
                    <img id="credFoto" src="https://placeholder.com" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="datos-gafete-contenedor">
                    <div style="margin-bottom: 0.75rem;">
                        <p class="cred-label">Nombre Completo</p>
                        <p id="credCompleto" class="cred-valor-principal">-</p>
                    </div>
                    <div class="grid-2" style="margin-bottom: 0.75rem; padding-top: 0.75rem; border-top: 1px solid #e5e7eb;">
                        <div>
                            <p class="cred-label">Puesto</p>
                            <p id="credPuesto" class="cred-valor-secundario">-</p>
                        </div>
                        <div>
                            <p class="cred-label">Zona</p>
                            <p id="credZona" class="cred-valor-secundario">-</p>
                        </div>
                    </div>
                    <div style="padding-top: 0.75rem; border-top: 1px solid #e5e7eb;">
                        <p class="cred-label">CURP Oficial</p>
                        <p id="credIdentificacion" class="cred-valor-mono">-</p>
                    </div>
                </div>
            </div>
            
            <div style="padding: 0 1.25rem 1.5rem 1.25rem; display: flex; gap: 0.75rem; flex-shrink: 0;">
                <button type="button" id="btnEditarPerfil" class="btn-buscar" style="flex: 1; padding: 0.8rem 0;">✏️ Modificar</button>
                <button type="button" id="btnCerrar" class="btn-buscar" style="background-color: #6b7280; padding: 0.8rem 1rem;">◀ Salir</button>
            </div>

            <div class="logos-salud-barra">
                <span style="color: #166534; font-family: serif;">IMSS</span>
                <span style="color: #831843; font-family: serif;">ISSSTE</span>
                <span style="color: #991b1b; font-family: serif;">PEMEX</span>
                <span style="color: #15803d; font-family: serif;">PCIVIL</span>
                <span style="color: #064e3b; font-family: sans-serif; letter-spacing: -0.05em;">IMSS BIENESTAR</span>
            </div>
            <div style="display: flex; height: 6px; width: 100%; flex-shrink: 0;">
                <div style="width: 33.33%; background-color: #15803d;"></div>
                <div style="width: 33.33%; background-color: #ffffff;"></div>
                <div style="width: 33.33%; background-color: #b91c1c;"></div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
